apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ramameet-ratelimit
  namespace: default
spec:
  rateLimit:
    average: 100
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ramameet-headers
  namespace: default
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    customResponseHeaders:
      X-Powered-By: ""
      Server: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ramameet-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-ramameet-ratelimit@kubernetescrd,default-ramameet-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - meet.portofoliorama.my.id
      secretName: ramameet-tls
  rules:
    - host: meet.portofoliorama.my.id
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: ramameet-signaling
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ramameet-web
                port:
                  number: 80
