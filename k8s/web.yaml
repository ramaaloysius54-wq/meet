apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramameet-web
  namespace: default
  labels:
    app: ramameet-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ramameet-web
  template:
    metadata:
      labels:
        app: ramameet-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: ghcr.io/ramaaloysius54-wq/meet:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ramameet-config
                optional: true
            - secretRef:
                name: ramameet-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ramameet-web
  namespace: default
spec:
  selector:
    app: ramameet-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
