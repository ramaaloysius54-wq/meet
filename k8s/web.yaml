apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramameet-web
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ramameet-web
  template:
    metadata:
      labels:
        app: ramameet-web
    spec:
      containers:
        - name: web
          image: ghcr.io/ramaaloysius54-wq/meet:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ramameet-config
            - secretRef:
                name: ramameet-secrets
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ramameet-web
  namespace: default
spec:
  selector:
    app: ramameet-web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ramameet-web-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ramameet-web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
