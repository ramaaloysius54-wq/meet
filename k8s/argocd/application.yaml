apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ramameet-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ramameet
  source:
    repoURL: https://github.com/ramaaloysius54-wq/meet.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      exclude: "argocd/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
