apiVersion: v1
kind: ConfigMap
metadata:
  name: ramameet-config
  namespace: default
data:
  NEXT_PUBLIC_APP_URL: "https://meet.yourdomain.com"
  NEXT_PUBLIC_LIVEKIT_URL: "wss://meet.yourdomain.com"
  LIVEKIT_HTTP_URL: "http://ramameet-livekit:7880"
  NEXT_PUBLIC_SIGNALING_URL: "https://meet.yourdomain.com"
  SIGNALING_PORT: "4000"
  CORS_ORIGIN: "https://meet.yourdomain.com"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: default
data:
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 50100
      use_external_ip: true
    redis:
      address: ramameet-redis:6379
    logging:
      level: info
