# JANGAN commit secret asli ke Git. Apply manual ke cluster atau gunakan SealedSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: ramameet-secrets
  namespace: default
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "REPLACE_ME"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME"
  LIVEKIT_API_KEY: "REPLACE_LIVEKIT_KEY"
  LIVEKIT_API_SECRET: "REPLACE_LIVEKIT_SECRET_MIN_32_CHARS"
  LIVEKIT_KEYS: "REPLACE_LIVEKIT_KEY: REPLACE_LIVEKIT_SECRET_MIN_32_CHARS"
