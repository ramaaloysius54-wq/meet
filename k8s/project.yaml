apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ramameet
  namespace: argocd
spec:
  description: RamaMeet Production Project
  sourceRepos:
  - '*'
  destinations:
  - namespace: ramameet
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
