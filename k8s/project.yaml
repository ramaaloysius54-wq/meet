apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ramameet
  namespace: argocd
spec:
  description: Project ArgoCD untuk RamaMeet
  sourceRepos:
    - "https://github.com/ramaaloysius54-wq/meet"
    - "https://github.com/ramaaloysius54-wq/meet.git"
  destinations:
    - namespace: ramameet
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"