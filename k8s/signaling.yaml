apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramameet-signaling
  namespace: default
  labels:
    app: ramameet-signaling
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ramameet-signaling
  template:
    metadata:
      labels:
        app: ramameet-signaling
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: signaling
          image: ramaaloysius54/ramameet:latest
          imagePullPolicy: Always
          command: ["node", "/app/signaling/dist/index.js"]
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: ramameet-config
                optional: true
            - secretRef:
                name: ramameet-secrets
                optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ramameet-signaling
  namespace: default
spec:
  selector:
    app: ramameet-signaling
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP
