name: CI/CD Pipeline RamaMeet DevOps

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build Docker & Deploy RamaMeet (VPS + K3s + ArgoCD)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set Lowercase Image Name
        id: meta
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & Push Docker Image RamaMeet
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Sync Manifests & Files ke VPS (/var/www/ramameet)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

          echo "1. Pastikan direktori target ada di VPS..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22 "$VPS_USER@$VPS_HOST" \
            "mkdir -p /var/www/ramameet"

          echo "2. Mengirim file terbaru ke VPS..."
          sshpass -e rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='server/node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/ramameet/"

      - name: ☸️ Sync ArgoCD & Rollout Pods K3s
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "3. Sinkronisasi ArgoCD & Rollout K3s..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22 \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$GHCR_USER' '$GHCR_PASS'" << 'ENDK8S'
            set -euo pipefail
            GHCR_USER="$1"
            GHCR_PASS="$2"
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # 1. Pastikan namespace ramameet selalu ada
            kubectl create namespace ramameet --dry-run=client -o yaml | kubectl apply -f -

            # 2. Pasang pull secret GHCR ke ServiceAccount default agar tidak ImagePullBackOff
            kubectl create secret docker-registry ghcr-secret \
              --namespace=ramameet \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_USER" \
              --docker-password="$GHCR_PASS" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl patch serviceaccount default -n ramameet \
              -p '{"imagePullSecrets":[{"name":"ghcr-secret"}]}' || true

            # 3. Apply Project & Application ArgoCD
            if [ -f /var/www/ramameet/k8s/argocd/project.yaml ]; then
              kubectl apply -f /var/www/ramameet/k8s/argocd/project.yaml
            elif [ -f /var/www/ramameet/k8s/project.yaml ]; then
              kubectl apply -f /var/www/ramameet/k8s/project.yaml
            fi

            if [ -f /var/www/ramameet/k8s/argocd/application.yaml ]; then
              kubectl apply -f /var/www/ramameet/k8s/argocd/application.yaml
            elif [ -f /var/www/ramameet/k8s/application.yaml ]; then
              kubectl apply -f /var/www/ramameet/k8s/application.yaml
            fi

            kubectl patch application ramameet-prod -n argocd --type merge \
              -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true},"syncOptions":["CreateNamespace=true"]}}}' || true

            # 4. Paksa ArgoCD sync manifest terbaru dari Git
            kubectl annotate application ramameet-prod -n argocd \
              argocd.argoproj.io/refresh="hard" --overwrite || true

            # 5. Apply manifest workload langsung jika deployment belum dibuat oleh ArgoCD
            if ! kubectl get deployment ramameet-web -n ramameet >/dev/null 2>&1; then
              find /var/www/ramameet/k8s -maxdepth 2 -type f \( -name "*.yaml" -o -name "*.yml" \) \
                ! -path "*/argocd/*" ! -name "project.yaml" ! -name "application.yaml" \
                -exec kubectl apply -f {} \;
            fi

            # 6. Rollout aman untuk single-node VPS + auto-diagnosa jika pod gagal start
            rollout_check() {
              local DEPLOY="$1"
              if kubectl get deployment "$DEPLOY" -n ramameet >/dev/null 2>&1; then
                kubectl patch deployment "$DEPLOY" -n ramameet --type merge \
                  -p '{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":0,"maxUnavailable":1}}}}' || true

                kubectl rollout restart deployment/"$DEPLOY" -n ramameet

                if ! kubectl rollout status deployment/"$DEPLOY" -n ramameet --timeout=180s; then
                  echo "=== ROLLOUT $DEPLOY GAGAL - STATUS POD ==="
                  kubectl get pods -n ramameet -o wide
                  echo "=== EVENTS TERBARU ==="
                  kubectl get events -n ramameet --sort-by='.lastTimestamp' | tail -n 20
                  echo "=== LOGS CONTAINER ==="
                  kubectl logs -n ramameet deployment/"$DEPLOY" --tail=50 --all-containers=true || true
                  exit 1
                fi
              fi
            }

            rollout_check ramameet-web
            rollout_check ramameet-signaling

            # 7. Status akhir ArgoCD & Pods
            kubectl get applications -n argocd || true
            kubectl get pods -n ramameet -o wide
          ENDK8S