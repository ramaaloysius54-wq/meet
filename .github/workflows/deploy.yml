name: CI/CD Pipeline RamaMeet DevOps

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build Docker Hub & Sync ArgoCD (K3s)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Validasi Manifest k8s & Secret Docker Hub
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "❌ Secret DOCKERHUB_USERNAME atau DOCKERHUB_TOKEN belum diisi di GitHub Secrets!"
            exit 1
          fi

          if grep -rnE "USERNAME_DOCKERHUB|ghcr\.io|ghcr-secret" k8s/; then
            echo "❌ Masih ada placeholder USERNAME_DOCKERHUB atau sisa GHCR di folder k8s/! Ganti dulu dengan Docker ID huruf kecil kamu."
            exit 1
          fi

          DOCKER_USER=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "docker_user=${DOCKER_USER}" >> "$GITHUB_OUTPUT"
          echo "image_repo=${DOCKER_USER}/ramameet" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.meta.outputs.docker_user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build & Push Docker Image ke Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:latest
            ${{ steps.meta.outputs.image_repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ☸️ Sync ArgoCD & Rollout Pods K3s
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          DOCKER_USER: ${{ steps.meta.outputs.docker_user }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

          echo "1. Sync hanya manifest ArgoCD (project.yaml & application.yaml)..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22 "$VPS_USER@$VPS_HOST" \
            "mkdir -p /var/www/ramameet/k8s/argocd"

          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22" \
            ./k8s/argocd/ "$VPS_USER@$VPS_HOST:/var/www/ramameet/k8s/argocd/"

          echo "2. Trigger ArgoCD Sync & Rollout pods..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22 \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$DOCKER_USER' '$DOCKER_TOKEN' '$GIT_SHA'" << 'ENDK8S'
            set -euo pipefail
            DOCKER_USER="$1"
            DOCKER_TOKEN="$2"
            GIT_SHA="$3"
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # 1. Pastikan pull secret Docker Hub selalu tersedia di namespace default
            kubectl create secret docker-registry dockerhub-secret \
              --namespace=default \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="$DOCKER_USER" \
              --docker-password="$DOCKER_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl patch serviceaccount default -n default \
              -p '{"imagePullSecrets":[{"name":"dockerhub-secret"}]}' || true

            # 2. Apply HANYA manifest ArgoCD (workload diurus penuh oleh ArgoCD dari Git)
            kubectl apply -f /var/www/ramameet/k8s/argocd/project.yaml
            kubectl apply -f /var/www/ramameet/k8s/argocd/application.yaml

            # 3. Paksa ArgoCD refresh & tunggu sampai Synced dengan commit terbaru
            kubectl annotate application ramameet-prod -n argocd \
              argocd.argoproj.io/refresh="hard" --overwrite

            for i in $(seq 1 18); do
              SYNC_STATUS=$(kubectl get application ramameet-prod -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
              SYNC_REV=$(kubectl get application ramameet-prod -n argocd -o jsonpath='{.status.sync.revision}' 2>/dev/null || echo "")
              echo "ArgoCD [$i/18] status=$SYNC_STATUS rev=${SYNC_REV:0:7} target=${GIT_SHA:0:7}"
              if [ "$SYNC_STATUS" = "Synced" ] && [ "$SYNC_REV" = "$GIT_SHA" ]; then
                break
              fi
              sleep 5
            done

            # 4. Restart rollout agar K3s menarik image :latest yang baru di-push
            rollout_check() {
              local DEPLOY="$1"
              if kubectl get deployment "$DEPLOY" -n default >/dev/null 2>&1; then
                kubectl rollout restart deployment/"$DEPLOY" -n default

                if ! kubectl rollout status deployment/"$DEPLOY" -n default --timeout=180s; then
                  echo "=== ROLLOUT $DEPLOY GAGAL - STATUS POD ==="
                  kubectl get pods -n default -l app="$DEPLOY" -o wide || kubectl get pods -n default -o wide
                  echo "=== DESCRIBE PODS $DEPLOY ==="
                  kubectl describe pods -n default -l app="$DEPLOY" | tail -n 40 || true
                  echo "=== EVENTS TERBARU ==="
                  kubectl get events -n default --sort-by='.lastTimestamp' | tail -n 20
                  echo "=== LOGS CONTAINER ==="
                  kubectl logs -n default deployment/"$DEPLOY" --tail=50 --all-containers=true || true
                  exit 1
                fi
              fi
            }

            rollout_check ramameet-web
            rollout_check ramameet-signaling

            # 5. Status akhir ArgoCD & Pods
            kubectl get applications -n argocd
            kubectl get pods -n default -o wide
          ENDK8S
